name: Trending report

on:
  schedule:
    - cron: "30 0 * * *"  # 每日 08:30（台北）
    - cron: "0 1 * * 0"   # 每週日 09:00（台北）週報
  workflow_dispatch:
    inputs:
      kind:
        description: 報告類型
        type: choice
        options: [daily, weekly, pick, translate]
        default: daily
      notify:
        description: 是否發送 Telegram 通知
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trending-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide report kind
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then kind="$INPUT_KIND"
          elif [ "$SCHEDULE" = "0 1 * * 0" ]; then kind=weekly
          else kind=daily; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Build report
        if: steps.mode.outputs.kind != 'pick'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          KIND: ${{ steps.mode.outputs.kind }}
        run: |
          if [ "$KIND" = "translate" ]; then python -m trending translate
          else python -m trending "$KIND" --no-notify; fi

      # 說明圖用 runner 內建的 Google Chrome 截圖，只需要補中文與 emoji 字型
      - name: Install card fonts
        if: steps.mode.outputs.kind == 'daily' || steps.mode.outputs.kind == 'pick'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji

      - name: Daily pick
        id: pick
        if: steps.mode.outputs.kind == 'daily' || steps.mode.outputs.kind == 'pick'
        # 精選失敗不影響日報的發佈與通知
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VOICE_PROMPT: ${{ secrets.VOICE_PROMPT }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          KIND: ${{ steps.mode.outputs.kind }}
        run: |
          if [ "$KIND" = "pick" ]; then python -m trending pick --redo --no-notify
          else python -m trending pick --no-notify; fi

      - name: Commit report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "report: ${{ steps.mode.outputs.kind }} $(TZ=Asia/Taipei date +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Notify Telegram
        if: (steps.mode.outputs.kind == 'daily' || steps.mode.outputs.kind == 'weekly') && (github.event_name == 'schedule' || inputs.notify)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: python -m trending notify ${{ steps.mode.outputs.kind }}

      - name: Notify Telegram (daily pick)
        if: steps.pick.outcome == 'success' && (github.event_name == 'schedule' || inputs.notify)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: python -m trending notify pick
