<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}GitHub Trending 報告{% endblock %}</title>
<meta name="description" content="每天整理 GitHub 熱門 repo 是什麼、用在哪">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trending">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="{{ root }}manifest.webmanifest">
<link rel="icon" href="{{ root }}icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ root }}apple-touch-icon.png">
<link rel="stylesheet" href="{{ root }}style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ root }}index.html">📈 GitHub Trending<span class="brand-suffix"> 報告</span></a>
    <nav>
      <button class="install" id="install" type="button" hidden>安裝</button>
      <a href="{{ root }}index.html">所有報告</a>
      <a class="external" href="https://github.com/trending" target="_blank" rel="noopener">GitHub Trending ↗</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap site-footer">資料來源：GitHub Trending 與 GitHub API・每日自動產生</footer>
<a class="to-top" id="to-top" href="#" aria-label="回到頂端" hidden>↑</a>
{% block scripts %}{% endblock %}
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('{{ root }}sw.js'); });
}
(function () {
  var btn = document.getElementById('install'), prompt;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); prompt = e; btn.hidden = false;
  });
  btn.addEventListener('click', function () {
    if (!prompt) return;
    prompt.prompt();
    prompt.userChoice.finally(function () { prompt = null; btn.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { btn.hidden = true; });

  var top = document.getElementById('to-top');
  window.addEventListener('scroll', function () { top.hidden = window.scrollY < 800; }, { passive: true });
  top.addEventListener('click', function (e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
})();
</script>
</body>
</html>
