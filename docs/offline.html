<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>離線中 · GitHub Trending 報告</title>
<meta name="description" content="每天整理 GitHub 熱門 repo 是什麼、用在哪">
<link rel="alternate" hreflang="zh-Hant" href="https://ewanhohou.github.io/Github-Trending/offline.html">
<link rel="alternate" hreflang="en" href="https://ewanhohou.github.io/Github-Trending/en/offline.html">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trending">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">

</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">📈 GitHub Trending<span class="brand-suffix"> 報告</span></a>
    <nav>
      <button class="install" id="install" type="button" hidden>安裝</button>
      <a class="lang-switch" href="en/offline.html" hreflang="en" lang="en" data-lang="en">English</a>
      <a href="index.html">所有報告</a>
      <a class="external" href="https://github.com/trending" target="_blank" rel="noopener">GitHub Trending ↗</a>
    </nav>
  </div>
</header>
<main class="wrap">

<section class="hero offline">
  <h1>離線中</h1>
  <p class="muted">這一頁還沒有存到手機裡。看過的報告和最新一期日報、週報可以離線閱讀，連上網路後再試一次。</p>
  <p class="links"><a href="javascript:history.back()">‹ 返回上一頁</a><a href="index.html">所有報告</a></p>
</section>

</main>
<footer class="wrap site-footer">資料來源：GitHub Trending 與 GitHub API・每日自動產生 · <a href="https://github.com/ewanhohou/Github-Trending" target="_blank" rel="noopener">GitHub</a></footer>
<a class="to-top" id="to-top" href="#" aria-label="回到頂端" hidden>↑</a>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
(function () {
  // 記住手動切換的語言，首頁（也是 PWA 的起始頁）會依此開啟
  document.querySelectorAll('.lang-switch').forEach(function (a) {
    a.addEventListener('click', function () { try { localStorage.setItem('lang', a.dataset.lang); } catch (e) {} });
  });

  var btn = document.getElementById('install'), prompt;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); prompt = e; btn.hidden = false;
  });
  btn.addEventListener('click', function () {
    if (!prompt) return;
    prompt.prompt();
    prompt.userChoice.finally(function () { prompt = null; btn.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { btn.hidden = true; });

  var top = document.getElementById('to-top');
  window.addEventListener('scroll', function () { top.hidden = window.scrollY < 800; }, { passive: true });
  top.addEventListener('click', function (e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
})();
</script>
</body>
</html>
